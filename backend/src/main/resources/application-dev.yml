server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecocycle
    username: ecocycle
    password: ecocycle_dev_pw
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always