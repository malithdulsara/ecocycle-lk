server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecocycle
    username: ecocycle
    password: ecocycle_dev_pw
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:ecocycle-dev-secret-key-change-me-0123456789}
    access-token-minutes: 15
    refresh-token-days: 7
  admin:
    full-name: System Admin
    email: ${ADMIN_EMAIL:admin@ecocycle.lk}
    password: ${ADMIN_PASSWORD:Admin@12345}